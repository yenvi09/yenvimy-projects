
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Personal Profile ✨</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --pink: #ff72c6;
    --purple: #9b7bff;
    --blue: #68d5ff;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 25px 15px;
    font-family: "Segoe UI", sans-serif;
    color: white;
    overflow-x: hidden;
    background: linear-gradient(
        -45deg,
        #100b2b, #32104c, #111c42, #42143d
    );
    background-size: 400% 400%;
    animation: bgMove 12s ease infinite;
}

@keyframes bgMove {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
}

/* Ánh sáng nền */
.glow {
    position: fixed;
    width: 260px;
    height: 260px;
    border-radius: 50%;
    filter: blur(90px);
    opacity: .55;
    pointer-events: none;
    animation: float 7s ease-in-out infinite alternate;
}

.glow.one {
    background: #ff45bd;
    top: 5%;
    left: 5%;
}

.glow.two {
    background: #6e6bff;
    bottom: 5%;
    right: 5%;
    animation-delay: -3s;
}

@keyframes float {
    from { transform: translate(0, 0) scale(1); }
    to { transform: translate(45px, -35px) scale(1.3); }
}

/* Hạt sáng */
.particle {
    position: fixed;
    bottom: -20px;
    width: 5px;
    height: 5px;
    background: white;
    border-radius: 50%;
    opacity: .7;
    box-shadow: 0 0 12px #ff9ee8;
    pointer-events: none;
    animation: rise linear infinite;
}

@keyframes rise {
    to {
        transform: translateY(-110vh) translateX(50px);
        opacity: 0;
    }
}

/* Profile card */
.profile {
    width: 100%;
    max-width: 390px;
    padding: 35px 25px;
    text-align: center;
    border: 1px solid rgba(255,255,255,.22);
    border-radius: 28px;
    background: rgba(255,255,255,.09);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 20px 70px rgba(0,0,0,.35);
    position: relative;
    z-index: 1;
    animation: appear 1s ease both;
}

@keyframes appear {
    from { opacity: 0; transform: translateY(35px) scale(.96); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}

/* Avatar */
.avatar-wrap {
    width: 125px;
    height: 125px;
    margin: 0 auto 20px;
    padding: 4px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--pink), var(--purple), var(--blue));
    background-size: 200% 200%;
    animation: ring 4s linear infinite, bgMove 5s ease infinite;
    box-shadow: 0 0 25px rgba(255,114,198,.5);
}

.avatar {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid #24153e;
    display: block;
}

@keyframes ring {
    50% { box-shadow: 0 0 38px rgba(155,123,255,.9); }
}

h1 {
    font-size: 29px;
    letter-spacing: 1px;
    margin-bottom: 8px;
    background: linear-gradient(90deg, #fff, #ff9edc, #a9a4ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

.subtitle {
    color: #ded5f5;
    font-size: 14px;
    margin-bottom: 16px;
}

.bio {
    font-size: 14px;
    line-height: 1.8;
    color: #f1eaff;
    margin-bottom: 25px;
}

.badge {
    display: inline-block;
    padding: 7px 13px;
    margin-bottom: 22px;
    border: 1px solid rgba(255,255,255,.2);
    border-radius: 30px;
    background: rgba(255,255,255,.08);
    font-size: 12px;
    color: #ffd5ef;
}

/* Social buttons */
.socials {
    display: flex;
    flex-direction: column;
    gap: 13px;
}

.social {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    position: relative;
    overflow: hidden;
    padding: 15px;
    border-radius: 15px;
    text-decoration: none;
    color: white;
    font-size: 15px;
    font-weight: 600;
    border: 1px solid rgba(255,255,255,.22);
    background: rgba(255,255,255,.09);
    transition: transform .3s, box-shadow .3s, background .3s;
}

.social::before {
    content: "";
    position: absolute;
    top: 0;
    left: -120%;
    width: 70%;
    height: 100%;
    background: linear-gradient(
        90deg, transparent, rgba(255,255,255,.2), transparent
    );
    transform: skewX(-25deg);
    transition: left .6s;
}

.social:hover::before {
    left: 150%;
}

.social:hover {
    transform: translateY(-5px) scale(1.025);
    box-shadow: 0 10px 25px rgba(0,0,0,.22);
}

.social .icon {
    font-size: 22px;
}

.facebook:hover {
    background: #1877f2;
    border-color: #1877f2;
}

.instagram:hover {
    background: linear-gradient(45deg, #feda75, #fa7e1e, #d62976, #962fbf);
    border-color: transparent;
}

.tiktok:hover {
    background: #171717;
    border-color: #ff4e82;
    box-shadow: 0 0 22px rgba(255,50,130,.35);
}

.footer {
    margin-top: 27px;
    font-size: 12px;
    color: #c7badf;
}

.heart {
    display: inline-block;
    color: #ff72c6;
    animation: heartbeat 1.2s infinite;
}

@keyframes heartbeat {
    50% { transform: scale(1.35); }
}

@media (max-width: 420px) {
    .profile { padding: 30px 20px; }
    h1 { font-size: 26px; }
}
</style>
</head>

<body>

<div class="glow one"></div>
<div class="glow two"></div>

<main class="profile">

    <div class="avatar-wrap">
        <!-- Thay link ảnh bên dưới bằng ảnh của bạn -->
        <img

    </div>

    <!-- Bạn có thể đổi tên tại đây -->
    <h1>Yến Viii ♡</h1>

    <p class="subtitle">Welcome to my little world ✨</p>

    <div class="badge">♡ Just be yourself ♡</div>

    <p class="bio">

        ✨ Lưu giữ những khoảnh khắc đáng nhớ<br>
        💗 Follow mình để kết nối nhé!
    </p>

    <div class="socials">

        <a class="social facebook"
           href="https://www.facebook.com/share/17kWHPz2ed/?mibextid=wwXIfr"
           target="_blank" rel="noopener noreferrer">
            <span class="icon">📘</span>
            <span>Facebook</span>
            <span>↗</span>
        </a>

        <a class="social instagram"
           href="https://www.instagram.com/tryenvi1104"
           target="_blank" rel="noopener noreferrer">
            <span class="icon">📸</span>
            <span>Instagram</span>
            <span>↗</span>
        </a>

        <a class="social tiktok"
           href="https://www.tiktok.com/@yenviiiiii000?_r=1&_t=ZS-9AvrTpWDQNF"
           target="_blank" rel="noopener noreferrer">
            <span class="icon">🎵</span>
            <span>TikTok</span>
            <span>↗</span>
        </a>

    </div>

    <div class="footer">
        Made with <span class="heart">♥</span> for you
    </div>

</main>

<script>
// Tạo những hạt sáng bay lên
for (let i = 0; i < 35; i++) {
    const particle = document.createElement("div");
    particle.className = "particle";
    particle.style.left = Math.random() * 100 + "%";
    particle.style.animationDuration = (5 + Math.random() * 8) + "s";
    particle.style.animationDelay = (Math.random() * 8) + "s";
    particle.style.opacity = Math.random() * 0.7 + 0.2;
    particle.style.transform = `scale(${Math.random() * 1.5 + 0.5})`;
    document.body.appendChild(particle);
}
</script>

</body>
</html>
